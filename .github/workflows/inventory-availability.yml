name: Inventory availability

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inventory-availability-browser-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    permissions:
      contents: read
      pull-requests: read
    name: Inventory migration and impact preflight
    outputs:
      run: ${{ steps.impact.outputs.run }}
      matrix: ${{ steps.impact.outputs.matrix }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate migration identities before dependency setup
        run: node scripts/migrations/check-migrations.mjs --ci
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Select affected browser coverage
        id: impact
        env:
          BROWSER_SUITE: inventory
          BROWSER_EVENT_NAME: ${{ github.event_name }}
          BROWSER_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BROWSER_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ci/browser-feature-impact.mjs

  browser-shard:
    name: Inventory availability browser journeys (${{ matrix.feature }} ${{ matrix.shard }}/${{ matrix.shards }})
    needs: preflight
    if: ${{ needs.preflight.outputs.run == 'true' }}
    env:
      BROWSER_FEATURE: ${{ matrix.feature }}
    runs-on: ubuntu-latest
    # Match package-lock.json; browsers and OS libraries are already installed.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --user 1001 --ipc=host
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.preflight.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright test --config playwright.inventory.config.ts --shard=${{ matrix.shard }}/${{ matrix.shards }} --forbid-only
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: inventory-availability-browser-traces-${{ matrix.feature }}-${{ matrix.shard }}
          path: test-results/
          retention-days: 7

  browser:
    name: Inventory availability browser journeys
    needs: [preflight, browser-shard]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Require every Inventory browser shard
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci/require-selected-success.mjs browser-shard
