name: Inventory availability

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inventory-availability-browser-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser-shard:
    name: Inventory availability browser journeys (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config playwright.inventory.config.ts --shard=${{ matrix.shard }}/4
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: inventory-availability-browser-traces-${{ matrix.shard }}
          path: test-results/
          retention-days: 7

  browser:
    name: Inventory availability browser journeys
    needs: [browser-shard]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Require every Inventory browser shard
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci/require-success.mjs browser-shard
