name: Inventory availability

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inventory-availability-browser-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    permissions:
      contents: read
      pull-requests: read
    name: Inventory migration preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate migration identities before dependency setup
        run: node scripts/migrations/check-migrations.mjs --ci
        env:
          GITHUB_TOKEN: ${{ github.token }}

  browser-shard:
    name: Inventory availability browser journeys (${{ matrix.shard }}/4)
    needs: preflight
    runs-on: ubuntu-latest
    # Match package-lock.json; browsers and OS libraries are already installed.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --user 1001 --ipc=host
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright test --config playwright.inventory.config.ts --shard=${{ matrix.shard }}/4
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: inventory-availability-browser-traces-${{ matrix.shard }}
          path: test-results/
          retention-days: 7

  browser:
    name: Inventory availability browser journeys
    needs: [preflight, browser-shard]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Require every Inventory browser shard
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci/require-success.mjs preflight browser-shard
