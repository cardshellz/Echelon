name: Inventory availability

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inventory-availability-browser-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: Inventory availability browser journeys
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config playwright.inventory.config.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: inventory-availability-browser-traces
          path: test-results/
          retention-days: 7
