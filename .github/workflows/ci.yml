name: CI

# Runs on every PR and on pushes to main. Enable branch protection in
# GitHub repo settings → Branches → require "Typecheck + unit tests"
# status check to pass before merge.
#
# PostgreSQL coverage is listed in scripts/ci/postgres-test-manifest.ts. The
# shared impact owner selects complete affected owners on PRs; main and uncertain
# impact retain all eight shards. Every file keeps its own database and process.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    permissions:
      contents: read
      pull-requests: read
    name: Fast CI guards
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.impact.outputs.run }}
      files: ${{ steps.impact.outputs.files }}
      matrix: ${{ steps.impact.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate migration identities before dependency setup
        run: node scripts/migrations/check-migrations.mjs --ci
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Guard suites execute here once; the unit lane excludes this exact manifest.
      - name: Validate CI coverage, test exclusions, migrations and writer ownership
        run: node scripts/ci/run-test-lane.mjs guards
      - name: Select affected PostgreSQL coverage
        id: impact
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node --import tsx scripts/ci/postgres-test-impact.ts

  typecheck:
    name: Typecheck (${{ matrix.project }})
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        project: [application, server-tests, client-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Separate runners keep TypeScript heaps and incremental caches isolated.
      - name: Application types
        if: matrix.project == 'application'
        # A full check of this program needs ~4.2 GB (tsc --extendedDiagnostics
        # --incremental false, Oct 2026: main 4,170,245K), at Node's ~4 GB
        # default, so tsc dies out of memory on some runs. Same headroom as
        # the server test types below.
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: npm run check
      - name: Server test types
        if: matrix.project == 'server-tests'
        # This program needs ~4.1 GB of heap (tsc --extendedDiagnostics,
        # Oct 2026), past Node's ~4 GB default, so tsc would die out of memory.
        # 6 GB leaves headroom on the 16 GB runner; tsc is its only process.
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: npx tsc -p tsconfig.tests.server.json
      - name: Client test types
        if: matrix.project == 'client-tests'
        run: npx tsc -p tsconfig.tests.client.json

  unit-tests:
    name: Unit tests (${{ matrix.shard }}/4)
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # All non-guard unit files still run; Vitest partitions them by file.
      - run: node scripts/ci/run-test-lane.mjs unit --shard=${{ matrix.shard }}/4 --maxWorkers=2 --reporter=default --reporter=junit --outputFile=test-results/unit-${{ matrix.shard }}.xml
      - name: Upload unit test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: unit-tests-${{ matrix.shard }}
          path: test-results/unit-${{ matrix.shard }}.xml
          if-no-files-found: warn
          retention-days: 7

  contracts:
    name: Offline maintenance and UI contracts
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Inventory cutover maintenance contracts (offline only)
        run: |
          node --import tsx --test scripts/inventory-cutover-records-proposal-20260925.test.ts scripts/inventory-cutover-records-execution-20260925.test.ts
          npx tsc --noEmit --target ES2022 --module ESNext --moduleResolution Bundler --esModuleInterop --skipLibCheck --strict --types node scripts/inventory-cutover-records-*.ts
      - name: Procurement planning client contracts
        run: >-
          npx vitest run
          client/src/features/purchasing/__tests__/reorderEngine.test.ts
          client/src/features/purchasing/__tests__/forecastBacktesting.test.ts
          client/src/features/purchasing/__tests__/reorder-explanation-format.test.ts
          client/src/lib/__tests__/procurement-schedule-date.test.ts
          shared/procurement/__tests__/purchase-buying-review.test.ts
          shared/procurement/__tests__/document-relationships.test.ts
          shared/inventory/__tests__/cost-report-read.test.ts
          shared/inventory/__tests__/order-cogs-report.test.ts
      - name: Customer order lifecycle and saved cancellation contracts
        run: >-
          npx vitest run
          shared/__tests__/customer-order-fulfillment.test.ts
          client/src/customer-account/__tests__/order-cancellation-request.test.ts
      - name: Inventory shipment quantity UI contracts
        run: >-
          npx vitest run
          client/src/lib/__tests__/inventory-transaction-quantity.test.ts
          client/src/pages/__tests__/inventory-history-shipment-quantity.test.ts
      - name: Channel listing publication UI contracts
        run: >-
          npx vitest run
          client/src/features/channel-listing-publication/__tests__/api.test.ts
          client/src/features/channel-listing-publication/__tests__/model.test.ts
          client/src/features/channel-listing-publication/__tests__/listing-update-model.test.ts
          client/src/features/channel-listing-publication/__tests__/listing-intent-change-presentation.test.ts
      - name: Dropship listing policy UI contracts
        run: >-
          npx vitest run
          client/src/pages/dropship/__tests__/DropshipPortalCatalog.test.ts
          client/src/lib/__tests__/dropship-listing-preview.test.ts
          client/src/lib/__tests__/dropship-listing-price.test.ts
          client/src/lib/__tests__/dropship-pricing-rules.test.ts
          client/src/pages/dropship/__tests__/DropshipListingPreview.test.ts
          client/src/lib/__tests__/dropship-catalog-steps.test.ts
          client/src/lib/__tests__/dropship-catalog-choose.test.ts
          client/src/lib/__tests__/dropship-catalog-choose-requests.test.ts
          client/src/lib/__tests__/dropship-catalog-choose-words.test.ts
          client/src/pages/dropship/__tests__/DropshipCatalogChoose.test.ts
          client/src/lib/__tests__/dropship-api-json.test.ts
          client/src/lib/__tests__/dropship-catalog-publish.test.ts
          client/src/lib/__tests__/dropship-catalog-publish-requests.test.ts
          client/src/lib/__tests__/dropship-catalog-publish-words.test.ts
          client/src/pages/dropship/__tests__/DropshipCatalogPublish.test.ts
          client/src/lib/__tests__/dropship-listing-settings.test.ts
          client/src/pages/dropship/__tests__/DropshipCatalogFrame.test.ts
          client/src/lib/__tests__/dropship-ebay-category-rules.test.ts
          client/src/lib/__tests__/dropship-unsaved-changes.test.ts
          client/src/lib/__tests__/dropship-listing-settings-price-words.test.ts
          client/src/lib/__tests__/dropship-listing-settings-drafts.test.ts
          client/src/pages/dropship/__tests__/ListingSettingsFramework.test.ts
          client/src/lib/__tests__/dropship-listing-settings-access.test.ts
          client/src/lib/__tests__/dropship-listing-settings-words.test.ts
          client/src/lib/__tests__/dropship-listing-settings-store-requests.test.ts
          client/src/pages/dropship/__tests__/ListingSettingsPolicyShelf.test.ts
          client/src/lib/__tests__/dropship-listing-settings-content-requests.test.ts
          client/src/pages/dropship/__tests__/ListingSettingsCategoryDescription.test.ts
          client/src/lib/__tests__/dropship-listing-settings-recipe.test.ts
          client/src/pages/dropship/__tests__/ListingSettingsPriceRow.test.ts
          client/src/pages/dropship/__tests__/ListingSettingsTabs.test.ts
          client/src/lib/__tests__/dropship-listing-settings-drawer.test.ts
          client/src/pages/dropship/__tests__/ListingSettingsProductDrawer.test.ts
          client/src/lib/__tests__/dropship-listing-settings-product-edit.test.ts
          client/src/lib/__tests__/dropship-listing-settings-product-requests.test.ts
          client/src/pages/dropship/__tests__/ListingSettingsDrawerEdit.test.ts
          client/src/lib/__tests__/dropship-listing-settings-selection.test.ts
          client/src/lib/__tests__/dropship-listing-settings-bulk.test.ts
          client/src/lib/__tests__/dropship-listing-settings-bulk-requests.test.ts
          client/src/pages/dropship/__tests__/ListingSettingsBulk.test.ts
          client/src/lib/__tests__/dropship-listing-settings-price-check.test.ts
          client/src/lib/__tests__/dropship-listing-settings-price-check-requests.test.ts
          client/src/pages/dropship/__tests__/ListingSettingsPriceCheck.test.ts
          client/src/lib/__tests__/dropship-listing-settings-updated.test.ts
          client/src/lib/__tests__/dropship-listing-settings-updated-requests.test.ts
          client/src/pages/dropship/__tests__/ListingSettingsUpdatedProducts.test.ts
          client/src/lib/__tests__/dropship-listing-settings-categories.test.ts
          client/src/lib/__tests__/dropship-listing-settings-category-requests.test.ts
          client/src/pages/dropship/__tests__/ListingSettingsCategories.test.ts
          client/src/lib/__tests__/dropship-listing-settings-size-prices.test.ts
          client/src/lib/__tests__/dropship-listing-settings-size-prices-requests.test.ts
          client/src/pages/dropship/__tests__/ListingSettingsSizePrices.test.ts
          client/src/lib/__tests__/dropship-listing-settings-conversion.test.ts
          client/src/lib/__tests__/dropship-listing-settings-conversion-requests.test.ts
          client/src/pages/dropship/__tests__/ListingSettingsConversion.test.ts
          client/src/lib/__tests__/dropship-listing-settings-conversion-notice.test.ts
          client/src/pages/dropship/__tests__/ListingSettingsConversionNotice.test.ts
          client/src/lib/__tests__/dropship-listing-settings-attention.test.ts
          client/src/pages/dropship/__tests__/ListingSettingsHeaderBannerStrip.test.ts
          client/src/pages/dropship/__tests__/ListingSettingsStep.test.ts
          client/src/lib/__tests__/dropship-ebay-listing-setup.test.ts
          client/src/lib/__tests__/dropship-ebay-listing-query-sync.test.ts
          client/src/lib/__tests__/dropship-listing-push-status.test.ts
          client/src/lib/__tests__/dropship-cost-changes.test.ts
          client/src/pages/__tests__/dropship-portal-cost-changes-page.test.ts
      # test/browser is in no tsconfig, so nothing else type-checks the Catalog page's browser stubs and specs. The publish
      # run answers are typed against the shared contracts (contractAnswer), so a field a run contract adds or renames
      # fails here; other answers are parsed with the server's schemas when a journey runs (step 1 plan S2-5, TESTS17;
      # review round 2 CT11).
      - name: Dropship catalog browser stub types
        run: npx tsc --noEmit --incremental false --target ES2022 --module ESNext --moduleResolution Bundler --esModuleInterop --skipLibCheck --strict --types node --allowImportingTsExtensions --jsx preserve --lib esnext,dom test/browser/dropship-policy-catalog-stubs.ts test/browser/dropship-policy-listing-settings-*.ts test/browser/dropship-policy-catalog-steps.spec.ts test/browser/dropship-policy-catalog-choose.spec.ts test/browser/dropship-policy-catalog-publish-runs.spec.ts test/browser/dropship-policy-listing-access.spec.ts test/browser/dropship-policy-cost-changes-portal.spec.ts
      # These paths have no "unit" in them, so test:unit never selects them.
      - name: Dropship program finance contracts
        run: >-
          npx vitest run
          shared/dropship/__tests__/program-finance-money.test.ts
          shared/dropship/__tests__/program-finance-contract.test.ts
          shared/dropship/__tests__/program-finance-definitions.test.ts
          client/src/pages/__tests__/dropship-finance-model.test.ts
          client/src/pages/__tests__/dropship-finance-panel.test.ts

  check-and-unit:
    # Preserve the existing required check name; skipped/cancelled jobs are failures.
    name: Typecheck + unit tests
    needs: [preflight, typecheck, unit-tests, contracts]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Require every core check
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci/require-success.mjs preflight typecheck unit-tests contracts

  postgres-hardening-shard:
    name: PostgreSQL hardening (shard ${{ matrix.shard }}/${{ matrix.count }})
    needs: preflight
    if: ${{ needs.preflight.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.preflight.outputs.matrix) }}
    # Each matrix job owns a separate runner and disposable PostgreSQL service.
    # The runner also creates a fresh database and Vitest process for every file:
    # some legacy suites leave schemas behind even when files execute serially.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: echelon_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d echelon_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ECHELON_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/echelon_test
      ECHELON_TEST_DATABASE_DISPOSABLE: "true"
      POSTGRES_SELECTED_TEST_FILES: ${{ needs.preflight.outputs.files }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run PostgreSQL shard
        env:
          POSTGRES_SHARD: ${{ matrix.shard }}/${{ matrix.count }}
        run: node --import tsx scripts/ci/postgres-tests.ts "$POSTGRES_SHARD"
      - name: Upload PostgreSQL test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: postgres-hardening-${{ matrix.shard }}
          path: test-results/postgres-hardening-${{ matrix.shard }}/
          if-no-files-found: warn
          retention-days: 7

  postgres-hardening:
    # Retain the existing check identity; success requires every shard to pass.
    name: PostgreSQL hardening tests
    needs: [preflight, postgres-hardening-shard]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require selected PostgreSQL coverage
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci/require-selected-success.mjs postgres-hardening-shard
