name: CI

# Runs on every PR and on pushes to main. Enable branch protection in
# GitHub repo settings → Branches → require "Typecheck + unit tests"
# status check to pass before merge.
#
# PostgreSQL coverage is listed in scripts/ci/postgres-test-manifest.ts. Eight
# independent runners execute it with a fresh database and process per file;
# the original PostgreSQL check name aggregates every shard's result.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-unit:
    name: Typecheck + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Typecheck (tsc)
        run: npm run check
      - name: Unit tests
        run: npm run test:unit
      - name: Procurement planning client contracts
        run: >-
          npx vitest run
          client/src/features/purchasing/__tests__/reorderEngine.test.ts
          client/src/features/purchasing/__tests__/forecastBacktesting.test.ts
          client/src/features/purchasing/__tests__/reorder-explanation-format.test.ts
          client/src/lib/__tests__/procurement-schedule-date.test.ts
          shared/procurement/__tests__/purchase-buying-review.test.ts
          shared/inventory/__tests__/cost-report-read.test.ts
          shared/inventory/__tests__/order-cogs-report.test.ts
      - name: Inventory shipment quantity UI contracts
        run: >-
          npx vitest run
          client/src/lib/__tests__/inventory-transaction-quantity.test.ts
          client/src/pages/__tests__/inventory-history-shipment-quantity.test.ts
      - name: Dropship listing policy UI contracts
        run: >-
          npx vitest run
          client/src/lib/__tests__/dropship-ebay-policy-assignment.test.ts
          client/src/pages/dropship/__tests__/DropshipPortalCatalog.test.ts
          client/src/pages/dropship/__tests__/EbayListingSetupPanel.test.ts
          client/src/pages/dropship/__tests__/EbayListingPolicyOverridePanel.test.ts
          client/src/lib/__tests__/dropship-listing-preview.test.ts
          client/src/lib/__tests__/dropship-listing-price.test.ts
          client/src/lib/__tests__/dropship-pricing-rules.test.ts
          client/src/pages/dropship/__tests__/DropshipListingPreview.test.ts
          client/src/pages/dropship/__tests__/DropshipListingPriceEditor.test.ts

  postgres-hardening-shard:
    name: PostgreSQL hardening (shard ${{ matrix.shard }}/8)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    # Each matrix job owns a separate runner and disposable PostgreSQL service.
    # The runner also creates a fresh database and Vitest process for every file:
    # some legacy suites leave schemas behind even when files execute serially.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: echelon_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d echelon_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ECHELON_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/echelon_test
      ECHELON_TEST_DATABASE_DISPOSABLE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run PostgreSQL shard
        env:
          POSTGRES_SHARD: ${{ matrix.shard }}/8
        run: node --import tsx scripts/ci/postgres-tests.ts "$POSTGRES_SHARD"
      - name: Upload PostgreSQL test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: postgres-hardening-${{ matrix.shard }}
          path: test-results/postgres-hardening-${{ matrix.shard }}/
          if-no-files-found: warn
          retention-days: 7

  postgres-hardening:
    # Retain the existing check identity; success requires every shard to pass.
    name: PostgreSQL hardening tests
    needs: [postgres-hardening-shard]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require all PostgreSQL shards
        env:
          SHARD_RESULT: ${{ needs.postgres-hardening-shard.result }}
        run: |
          if [ "$SHARD_RESULT" != "success" ]; then
            echo "::error::PostgreSQL shards did not all pass (result: $SHARD_RESULT)"
            exit 1
          fi
