name: Feature browser coverage
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dropship-browser-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  select:
    permissions:
      contents: read
      pull-requests: read
    name: Select affected browser features
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.impact.outputs.run }}
      matrix: ${{ steps.impact.outputs.matrix }}
      migrations: ${{ steps.migrations.outcome }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: migrations
        name: Validate migration identities before dependency setup
        run: node scripts/migrations/check-migrations.mjs --ci
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - id: impact
        name: Check suite dependencies (uncertainty runs coverage)
        env:
          BROWSER_EVENT_NAME: ${{ github.event_name }}
          BROWSER_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BROWSER_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ci/dropship-browser-impact.mjs

  browser:
    name: ${{ matrix.label }} (${{ matrix.shard }}/${{ matrix.shards }})
    needs: select
    # Invalid migrations stop setup; later selector uncertainty still runs coverage.
    if: ${{ !cancelled() && needs.select.outputs.migrations == 'success' && (needs.select.result != 'success' || needs.select.outputs.run != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 4
      # Job-level if runs before matrix expansion: an explicit safe skip starts
      # no browsers. If selection crashes without output, run the full suite.
      matrix: ${{ fromJSON(needs.select.outputs.matrix || '{"include":[{"feature":"all","label":"Full coverage fallback","shard":1,"shards":2},{"feature":"all","label":"Full coverage fallback","shard":2,"shards":2}]}') }}
    env:
      BROWSER_FEATURE: ${{ matrix.feature }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config playwright.dropship-pricing.config.ts --shard=${{ matrix.shard }}/${{ matrix.shards }} --forbid-only
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: feature-browser-traces-${{ matrix.feature }}-${{ matrix.shard }}
          path: test-results/
          retention-days: 7

  result:
    # Preserve the aggregate check identity for existing branch rules and links.
    name: Dropship pricing browser journeys
    needs: [select, browser]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require complete browser coverage or an explicit safe skip
        env:
          MIGRATIONS_RESULT: ${{ needs.select.outputs.migrations }}
          SELECT_RESULT: ${{ needs.select.result }}
          RUN_SUITE: ${{ needs.select.outputs.run }}
          SHARD_RESULT: ${{ needs.browser.result }}
        run: |
          if [ "$MIGRATIONS_RESULT" != "success" ]; then
            echo "::error::Migration validation did not pass"
            exit 1
          fi
          if [ "$SELECT_RESULT" != "success" ]; then
            echo "::error::Browser coverage selection failed"
            exit 1
          fi
          if [ "$RUN_SUITE" = "false" ] && [ "$SHARD_RESULT" = "skipped" ]; then
            echo "Dependency analysis found no affected dropship browser coverage."
            exit 0
          fi
          if [ "$RUN_SUITE" != "true" ] || [ "$SHARD_RESULT" != "success" ]; then
            echo "::error::Dropship browser shards did not all pass (result: $SHARD_RESULT)"
            exit 1
          fi
