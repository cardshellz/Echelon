name: Procurement navigation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: procurement-browser-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  select:
    permissions:
      contents: read
      pull-requests: read
    name: Select procurement browser coverage
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.impact.outputs.run }}
      migrations: ${{ steps.migrations.outcome }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: migrations
        name: Validate migration identities before dependency setup
        run: node scripts/migrations/check-migrations.mjs --ci
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - id: impact
        name: Check suite dependencies (uncertainty runs coverage)
        env:
          BROWSER_SUITE: procurement
          BROWSER_EVENT_NAME: ${{ github.event_name }}
          BROWSER_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BROWSER_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ci/browser-suite-impact.mjs

  browser:
    name: Procurement browser journeys (${{ matrix.shard }}/${{ matrix.shards }})
    needs: select
    # Invalid migrations stop setup; later selector uncertainty still runs coverage.
    if: ${{ !cancelled() && needs.select.outputs.migrations == 'success' && (needs.select.result != 'success' || needs.select.outputs.run != 'false') }}
    runs-on: ubuntu-latest
    # The budget includes dependency/browser setup, test execution, and artifacts.
    # Eight shards reduce test load; headroom accommodates hosted runner variance.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
        shards: [8]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Two page-isolated workers per runner; the eight shards retain separate servers.
      - run: npx playwright test --config playwright.procurement.config.ts --shard=${{ matrix.shard }}/${{ matrix.shards }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: procurement-browser-traces-${{ matrix.shard }}
          path: test-results/
          retention-days: 7

  result:
    name: Procurement browser journeys
    needs: [select, browser]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require complete browser coverage or an explicit safe skip
        env:
          MIGRATIONS_RESULT: ${{ needs.select.outputs.migrations }}
          SELECT_RESULT: ${{ needs.select.result }}
          RUN_SUITE: ${{ needs.select.outputs.run }}
          SHARD_RESULT: ${{ needs.browser.result }}
        run: |
          if [ "$MIGRATIONS_RESULT" != "success" ]; then
            echo "::error::Migration validation did not pass"
            exit 1
          fi
          if [ "$SELECT_RESULT" != "success" ]; then
            echo "::error::Browser coverage selection failed"
            exit 1
          fi
          if [ "$RUN_SUITE" = "false" ] && [ "$SHARD_RESULT" = "skipped" ]; then
            echo "Dependency analysis found no affected procurement browser coverage."
            exit 0
          fi
          if [ "$RUN_SUITE" != "true" ] || [ "$SHARD_RESULT" != "success" ]; then
            echo "::error::Procurement browser shards did not all pass (result: $SHARD_RESULT)"
            exit 1
          fi
