name: Returns portal admin preview

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: returns-preview-browser-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: Returns preview browser journeys
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config playwright.returns-preview.config.ts
      - name: Upload browser traces and screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: returns-preview-browser-results
          path: test-results/
          if-no-files-found: warn
          retention-days: 7
