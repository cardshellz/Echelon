name: Returns portal admin preview

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: returns-preview-browser-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser-shard:
    name: Returns preview browser journeys (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config playwright.returns-preview.config.ts --shard=${{ matrix.shard }}/4
      - name: Upload browser traces and screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: returns-preview-browser-results-${{ matrix.shard }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 7

  browser:
    name: Returns preview browser journeys
    needs: [browser-shard]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Require every Returns shard
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci/require-success.mjs browser-shard
